name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-checks:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      TMDB_BASE_URL: https://image.tmdb.org/t/p/
      TMDB_URL: https://api.themoviedb.org/3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build application
        run: npm run build

      - name: Synchronize cinema programme from TMDB
        run: npm run sync:programme

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright JSON report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: playwright-report.json
          if-no-files-found: ignore
